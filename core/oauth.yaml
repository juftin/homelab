# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
#######################################
#OAUTH (GOOGLE OAUTH FOR ADMIN)
#######################################

secrets:
    google-oauth:
        file: ${DOCKER_DIRECTORY}/secrets/google_oauth.secret
    google-oauth-emails:
        file: ${DOCKER_DIRECTORY}/secrets/google_oauth_emails.secret

services:
    oauth:
        container_name: oauth
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6@sha256:c3415e8660af553f5e18f5d90db050614c02493c0ac6260ac59442f6d9b12048
        user: ${PUID:-1000}:${PGID:-1000}
        command:
            - --config=/run/secrets/google-oauth
            - --authenticated-emails-file=/run/secrets/google-oauth-emails
            - --http-address=0.0.0.0:4180
            - --provider=google
            - --reverse-proxy=true
            - --trusted-proxy-ip=192.168.90.0/24 # homelab-core_traefik
            - --upstream=static://202
            - --skip-provider-button=true
            - --set-xauthrequest=true
            - --code-challenge-method=S256
            - --cookie-name=__Secure-homelab-oauth
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-expire=720h
            - --cookie-refresh=45m
            - --request-logging=false
        environment:
            OAUTH2_PROXY_COOKIE_DOMAINS: .${DOMAIN_NAME}
            OAUTH2_PROXY_WHITELIST_DOMAINS: ${DOMAIN_NAME},.${DOMAIN_NAME}
            OAUTH2_PROXY_REDIRECT_URL: https://${OAUTH_SUBDOMAIN:-oauth}.${DOMAIN_NAME}/_oauth
        secrets:
            - google-oauth
            - google-oauth-emails
        networks:
            traefik:
        security_opt:
            - no-new-privileges:true
        restart: always
        depends_on:
            - cloudflare-ddns
        labels:
            traefik.enable: true
            traefik.http.routers.oauth-rtr.rule: Host(`${OAUTH_SUBDOMAIN:-oauth}.${DOMAIN_NAME}`) && Path(`/_oauth`)
            traefik.http.routers.oauth-rtr.entrypoints: websecure
            traefik.http.routers.oauth-rtr.service: oauth-svc
            traefik.http.services.oauth-svc.loadbalancer.server.port: 4180
            traefik.http.routers.oauth-rtr.middlewares: chain-no-auth@file,oauth-callback
            traefik.http.middlewares.oauth-callback.replacepath.path: /oauth2/callback
