# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
#######################################
# RECYCLARR (TRASH GUIDES SYNC)
#######################################

services:
    recyclarr:
        container_name: recyclarr
        image: ghcr.io/recyclarr/recyclarr:8@sha256:3e9c41b9ec29bbf65fe846864058730d321a21f7695d8c0d9437b73e34d50ad9
        user: ${PUID:-1000}:${PGID:-1000}
        volumes:
            - ${DOCKER_DIRECTORY}/appdata/recyclarr:/config
        environment:
            TZ: ${TZ}
            CRON_SCHEDULE: ${RECYCLARR_CRON_SCHEDULE:-@daily}
            RECYCLARR_CREATE_CONFIG: ${RECYCLARR_CREATE_CONFIG:-true}
        security_opt:
            - no-new-privileges:true
        restart: ${UNIVERSAL_RESTART_POLICY:-unless-stopped}
        networks:
            traefik:
