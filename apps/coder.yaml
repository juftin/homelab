# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

####################################
# Coder: Remote Development
####################################

services:
    coder:
        container_name: coder
        image: ghcr.io/coder/coder:latest@sha256:e71d75fac8743c1295ab5394a3ec05aeb9849c997fd670c914c27334bb8a7761
        environment:
            CODER_PG_CONNECTION_URL: "postgresql://${CODER_POSTGRES_USER:-coder}:${CODER_POSTGRES_PASSWORD:-coder}@coder-db/${CODER_POSTGRES_DB:-coder}?sslmode=disable"
            CODER_HTTP_ADDRESS: "0.0.0.0:7080"
            CODER_ACCESS_URL: "https://${CODER_SUBDOMAIN:-coder}.${DOMAIN_NAME}"
            DOCKER_HOST: tcp://socket-proxy:2375
        depends_on:
            coder-db:
                condition: service_healthy
        security_opt:
            - no-new-privileges:true
        restart: ${UNIVERSAL_RESTART_POLICY:-unless-stopped}
        networks:
            traefik:
            internal:
            docker:
        labels:
            traefik.enable: true
            traefik.http.routers.coder-rtr.rule: Host(`${CODER_SUBDOMAIN:-coder}.${DOMAIN_NAME}`)
            traefik.http.routers.coder-rtr.service: coder-svc
            traefik.http.services.coder-svc.loadbalancer.server.port: 7080
            traefik.http.routers.coder-rtr.entrypoints: websecure
            traefik.http.routers.coder-rtr.middlewares: chain-rate-limit@file
    coder-db:
        image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        environment:
            POSTGRES_USER: ${CODER_POSTGRES_USER:-coder}
            POSTGRES_PASSWORD: ${CODER_POSTGRES_PASSWORD:-coder}
            POSTGRES_DB: ${CODER_POSTGRES_DB:-coder}
        volumes:
            - ${DOCKER_DIRECTORY}/appdata/coder/db:/var/lib/postgresql/data
        security_opt:
            - no-new-privileges:true
        restart: ${UNIVERSAL_RESTART_POLICY:-unless-stopped}
        networks:
            internal:
        healthcheck:
            test: ["CMD", "pg_isready", "-U", "${CODER_POSTGRES_USER:-coder}"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s
