# Prometheus Configuration — camply Monitoring
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    application: camply
scrape_configs:
  - job_name: "camply-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["camply:8000"]
    scrape_interval: 15s
  - job_name: "camply-worker"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["camply-worker:8001"]
    scrape_interval: 15s
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
