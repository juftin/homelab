#######################################
# RADARR (MOVIE DOWNLOADS)
#######################################

services:
    radarr:
        container_name: radarr
        image: lscr.io/linuxserver/radarr:latest@sha256:044788f5508b7f67a3e0368cdd142c77c4d4cd5aec2efaba53e1a68b6b6231e7
        volumes:
            - ${DOCKER_DIRECTORY}/appdata/radarr:/config
            - type: bind
              source: ${MEDIA_ROOT:-${COMPLETED_DOWNLOADS}}
              target: /data
              bind:
                  create_host_path: false
        environment:
            PUID: ${PUID}
            PGID: ${PGID}
            TZ: ${TZ}
            UMASK: ${UMASK:-002}
        security_opt:
            - no-new-privileges:true
        restart: ${UNIVERSAL_RESTART_POLICY:-unless-stopped}
        networks:
            traefik:
        labels:
            traefik.enable: true
            traefik.http.routers.radarr-rtr.rule: Host(`${RADARR_SUBDOMAIN:-radarr}.${DOMAIN_NAME}`)
            traefik.http.routers.radarr-rtr.entrypoints: websecure
            traefik.http.routers.radarr-rtr.service: radarr-svc
            traefik.http.services.radarr-svc.loadbalancer.server.port: 7878
            traefik.http.routers.radarr-rtr.middlewares: chain-oauth-google@file
