# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

name: renovate
on:
    workflow_dispatch:
    schedule:
        - cron: "0/15 * * * *"
    push:
        paths:
            - .github/workflows/renovate.yaml
            - .github/renovate-config.js
            - .renovaterc.json5
        branches:
            - gitops
jobs:
    renovate:
        name: renovate
        runs-on: ubuntu-latest
        concurrency:
            group: ${{ github.workflow }}
            cancel-in-progress: false
        steps:
            - name: checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  ref: gitops
            - name: Generate GitHub App Token
              id: app-token
              env:
                  APP_ID: ${{ secrets.RENOVATE_APP_ID || secrets.APP_ID }}
                  APP_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY || secrets.APP_PRIVATE_KEY }}
              if: ${{ env.APP_ID != '' && env.APP_KEY != '' }}
              uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
              with:
                  app-id: ${{ env.APP_ID }}
                  private-key: ${{ env.APP_KEY }}
                  owner: ${{ github.repository_owner }}
            - name: renovate
              uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
              with:
                  token: ${{ steps.app-token.outputs.token || secrets.APP_TOKEN || secrets.RENOVATE_TOKEN }}
                  configurationFile: .github/renovate-config.js
                  renovate-version: 42.39.1
              env:
                  RENOVATE_REPOSITORY: ${{ github.repository }}
                  RENOVATE_DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
                  RENOVATE_DOCKER_PASSWORD: ${{ secrets.DOCKER_TOKEN }}
                  LOG_LEVEL: info
