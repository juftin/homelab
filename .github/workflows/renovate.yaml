# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

name: renovate
on:
    workflow_dispatch:
    schedule:
        - cron: "0/15 * * * *"
    push:
        paths:
            - .github/workflows/renovate.yaml
            - .github/renovate-config.js
            - .renovaterc.json5
        branches:
            - gitops
jobs:
    renovate:
        name: renovate
        runs-on: ubuntu-latest
        concurrency:
            group: ${{ github.workflow }}
            cancel-in-progress: false
        steps:
            - name: checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  ref: gitops
            - name: renovate
              uses: renovatebot/github-action@5402b206248e5a8c8427a15102702eb9c1793efc # v46.2.4
              with:
                  token: ${{ secrets.RENOVATE_TOKEN }}
                  configurationFile: .github/renovate-config.js
                  renovate-version: 42.39.1
              env:
                  RENOVATE_REPOSITORY: ${{ github.repository }}
                  RENOVATE_DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
                  RENOVATE_DOCKER_PASSWORD: ${{ secrets.DOCKER_TOKEN }}
                  LOG_LEVEL: info
