# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

name: renovate
on:
    workflow_dispatch:
    schedule:
        - cron: "0/15 * * * *"
    push:
        paths:
            - .github/workflows/renovate.yaml
            - .github/renovate-config.js
            - .renovaterc.json5
        branches:
            - gitops
jobs:
    renovate:
        name: renovate
        runs-on: ubuntu-latest
        concurrency:
            group: ${{ github.workflow }}
            cancel-in-progress: false
        steps:
            - name: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: gitops
            - name: renovate
              uses: renovatebot/github-action@39b914146caeff8cd512e61c8992f1d5913af85c # v46.2.5
              with:
                  token: ${{ secrets.RENOVATE_TOKEN }}
                  configurationFile: .github/renovate-config.js
                  renovate-version: 42.39.1
              env:
                  RENOVATE_REPOSITORY: ${{ github.repository }}
                  RENOVATE_DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
                  RENOVATE_DOCKER_PASSWORD: ${{ secrets.DOCKER_TOKEN }}
                  LOG_LEVEL: info
