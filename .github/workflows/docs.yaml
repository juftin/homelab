name: docs
on:
    push:
        branches: [main]
jobs:
    release:
        name: docs
        if: false
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
            - name: setup-uv
              uses: astral-sh/setup-uv@e06108dd0aef18192324c70427afc47652e63a82 # v7
            - name: docs
              run: uv run mkdocs build
            - name: github-pages
              uses: juftin/actions/github-pages@5a54b64fe07d8de40f92676cae6b56c565ec28b2 # v1
              id: deployment
